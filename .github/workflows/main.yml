name: Build Forge 1.20.1 mod
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch official Forge MDK
        run: |
          curl -fL --retry 3 -o /tmp/mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p /tmp/mdk
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          cp /tmp/mdk/gradlew ./gradlew
          cp -r /tmp/mdk/gradle ./gradle
          chmod +x ./gradlew
      - name: Build mod
        run: ./gradlew build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TheLocustHorror-JAR
          path: build/libs/*.jar
